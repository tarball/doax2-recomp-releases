# Mid-asm hooks (runtime/game/): changes inside game functions.
# sub_825A57F8's quaternion-to-Euler conversion: m22 (f30) or m11 (f29) of exactly 0.0 took special cases that stood the
# Pool's air mattress upright (reached through how the VMX dot products round, see runtime/game/euler.cpp); with a
# nonzero numerator (f27, f28) these go on to the general formulas instead.
[[midasm_hook]]
name = "EulerZeroDenominatorMidAsmHook"
address = 0x825A5AF4
registers = ["f30", "f27"]
jump_address_on_true = 0x825A5B74

[[midasm_hook]]
name = "EulerZeroDenominatorMidAsmHook"
address = 0x825A5B74
registers = ["f29", "f28"]
jump_address_on_true = 0x825A5BFC
