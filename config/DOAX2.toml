# XenonRecomp config for Dead or Alive Xtreme 2 (USA), title ID 544307D2, XDK 2.0.3529.
# Addresses were found by the DOA4 analysis tools (see ANALYSIS.md); verify before relying on them.

[main]
file_path = "../private/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "DOAX2_switch_tables.toml"  # generated by tools/boundaries.py from XenonAnalyse output

# Optimizations (as DOA4's config has them): CR, CTR, XER, the reservation, and the registers that don't carry
# arguments or results across calls (r0, r2, r11, r12, r14-r31, f0, f14-f31 and most VMX registers) are function
# locals rather than PPCContext fields, so the compiler can keep them in host registers; MSR isn't modeled. LR stays
# tracked (skip_lr = false): stack walks for backtraces read the return addresses functions save, and with
# non_volatile_as_local the calls to __savegprlr_* are dropped except for that store (a XenonRecomp change on our
# branch). non_argument_as_local needs non_volatile_as_local: the __savefpr/__savevmx helpers take their address in
# r12, a local otherwise.
skip_lr = false
skip_msr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = true
non_volatile_as_local = true
# Functions that exchange registers outside the calling convention (SEH funclets and their parents, functions split
# around jump tables, the save/restore helpers) keep them all in the context: generated by tools/abiscan.py
# (a XenonRecomp option on our branch).
keep_registers_in_context_file_path = "DOAX2_keep_registers.toml"
# Every store checks netplay's store map (runtime/ppc_overrides.h, runtime/netplay/page_log.h); runs of stores off one
# base register in straight-line code share one check (a XenonRecomp option on our branch).
group_stores = true

restgprlr_14_address = 0x829EFE00
savegprlr_14_address = 0x829EFDB0
restfpr_14_address = 0x829F0E1C
savefpr_14_address = 0x829F0DD0
restvmx_14_address = 0x829F2CF8
savevmx_14_address = 0x829F2A60
restvmx_64_address = 0x829F2D8C
savevmx_64_address = 0x829F2AF4

# longjmp: calls RtlUnwind at 0x829F1180, forces val=1 when 0, checks jmp_buf+0x138. 18 calls and 3 tail branches (CRI).
longjmp_address = 0x829F1080
# setjmp: leaf function (not in .pdata), 0x829F12D0-0x829F139C: a lis/lwz/bnectr check (as DOA4's 0x82A04560), then
# stores f14.. / r14.. into (r3). 10 call sites.
setjmp_address = 0x829F12D0

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
    # 8-byte exception records (handler address, scope table in .rdata) placed before functions with handlers.
    { data = 0x82A731AC, size = 8 }, # __C_specific_handler import thunk; precedes 53 functions
    { data = 0x829F4428, size = 8 }, # C++ frame handler; precedes 5 functions
    { data = 0x82A02F40, size = 8 }, # local handler sub_82A02F40; precedes 1 function
]

